name: Switch NXVK Zink and Vulkan experimental

on:
  push:
    branches: [switch-nxvk-zink]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switch-nxvk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout pinned NXVK source
        uses: actions/checkout@v4
        with:
          repository: PalindromicBreadLoaf/nxvk
          ref: e028d428c3b1f2dabadd81645c53cddfc8d7ab51
          path: nxvk-source
      - name: Restore built NXVK portlib
        id: nxvk-cache
        uses: actions/cache/restore@v4
        with:
          path: nxvk-source/switch/build/pkg
          key: nxvk-zink-e028d428c3b1f2dabadd81645c53cddfc8d7ab51-v1
      - name: Build NXVK toolchain image
        run: docker build -t paperboat-nxvk nxvk-source/switch/docker
      - name: Build Zink, native Vulkan and PaperBoat
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/nxvk-source:/work" \
            -v "$GITHUB_WORKSPACE:/paperboat" \
            -w /work paperboat-nxvk bash /paperboat/scripts/build-switch-nxvk.sh
      - name: Cache completed driver even if the game build fails
        if: ${{ always() && steps.nxvk-cache.outputs.cache-hit != 'true' && hashFiles('nxvk-source/switch/build/pkg/lib/libnvk_gl.a') != '' }}
        uses: actions/cache/save@v4
        with:
          path: nxvk-source/switch/build/pkg
          key: nxvk-zink-e028d428c3b1f2dabadd81645c53cddfc8d7ab51-v1
      - uses: actions/upload-artifact@v4
        if: ${{ success() && hashFiles('build-switch-nxvk/native-vulkan-ready') != '' }}
        with:
          name: paperboat-switch-nxvk-zink-experimental
          path: build-switch-nxvk/switch/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() && hashFiles('build-switch-nxvk/native-vulkan-ready') != '' }}
        with:
          name: paperboat-nxvk-documentation
          path: build-switch-nxvk/documentation/
          if-no-files-found: error
